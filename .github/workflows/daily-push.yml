name: 基金每日战报

on:
  schedule:
    # UTC 14:00 = 北京时间 22:00（基金净值当日已基本公布完毕）
    # GitHub 定时任务可能有 0~30 分钟延迟；想更早/更晚可自行增删 cron 行
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发，方便测试

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成并发送每日战报
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
        run: python scripts/daily_push.py
